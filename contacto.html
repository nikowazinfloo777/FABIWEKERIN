            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="caja3">
        <h1>Formulario de contacto</h1>
        <form method="post" action="#">
            <label class="Nombre" for="Nombre">Nombre:</label>
            <input type="text" id="Nombre" name="Nombre" required placeholder=" ">
            <br>
            <label class="Correo" for="Correo">Correo:</label>
            <input type="email" id="Correo" name="Correo" required placeholder=" ">
            <br>
            <label class="Mensaje" for="Mensaje">Mensaje:</label>
            <textarea name="Mensaje" id="Mensaje" required placeholder=" "></textarea>
            <button type="submit">Enviar</button>

        </form>
    </main>
